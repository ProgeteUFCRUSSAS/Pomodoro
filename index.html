<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <!-- Configurações de metadados -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/images/logo.png" type="image">
    <link rel="stylesheet" href="./assets/style/home.css">
    <title>TimePomo</title>
</head>
<body class="main-body"> 
    <!-- Seção principal do conteúdo -->
    <section class="main-content">
        <div class="timer">
            <!-- Relógio do Pomodoro -->
            <div class="relogio" id="relogio">25:00</div>
            <div class="botoes">
                <!-- Botões de controle do Pomodoro -->
                <button type="button" class="botao Iniciar btn-menu" id="Iniciar">INICIAR</button>
                <button type="button" class="botao Pausar btn-menu" id="Pausar">PAUSAR</button>
                <button type="button" class="botao Resetar btn-menu" id="Resetar">RESETAR</button>
            </div>

        

            <div class="botoes">
                <!-- Botões de controle do Pomodoro -->
                <button type="button" class="dimmer b25 btn" data-time="25" id="pomo">Pomodoro</button>
                <button type="button" class="transparent b5 btn" data-time="5" id="rest">Pausa curta</button>
                <button type="button" class="transparent b10 btn" data-time="10" id="long">Pausa longa</button>
                <button type="button" class="cust" data-time="25" id="custom-minutes-button">Personalizado</button>
            </div>
        </div>
    </section>

    <!-- Menu superior -->
    <aside class="menu">
        <section class="main-content menu-content">
            <h1 class="menu-title">TimePomo</h1>
            <nav>
                <ul>
                    <!-- Link para a página Sobre Nós -->
                    <li><a target="_blank" rel="noopener noreferrer" href="https://sites.google.com/view/progete/início">Sobre nós</a></li>
                </ul>
            </nav>
        </section>
    </aside>

    <!-- menu tempo personalizado -->
    <dialog id="custom-dia" >
        <div class="custom-timer-input" id="custom-timer-container" >
            <button class="cancelar" id="cancelar">x <br></button>
            <label for="custom-minutes">Definir tempo (minutos):</label>
            <input type="number" id="custom-minutes" min="1" value="25">
            <button id="set-custom-timer">Aplicar</button>
        </div>
    </dialog>

        <!-- Área de Gerenciamento de Tarefas -->
    
    <div class="task-add">
        <button id="adicionar-tarefa" class="btn-adicionar"><h1>Adicionar Nova Tarefa</h1></button>
    </div>

        <div id="task-list"></div>
    </div>

    <!-- Modal de Menu com o Formulário de Tarefas -->
    <dialog id="menu-dialog">
            <h1>Gerenciador de Tarefas</h1>
            <form id="task-form">
                <input type="text" id="task-title" maxlength="80" placeholder="Título da Tarefa" required>
                <textarea id="task-desc" class="task-desc" placeholder="Descrição da Tarefa" required></textarea>
                <div class="cycle-control">
                    <label for="task-cycles">Quantidade de Ciclos:</label>
                    <div class="cycle-buttons">
                        <input type="number" id="task-cycles" min="1" value="0" readonly>
                        <button type="button" id="decrease-cycles" class="cycle-btn">-</button>
                        <button type="button" id="increase-cycles" class="cycle-btn">+</button>
                    </div>
                </div>
                <button type="submit" class="add-task">Adicionar Tarefa</button>
            </form>
            <button id="fechar-menu">Fechar Menu</button>
    </dialog>

    <audio src="./assets/sounds/ding-check.mp3" id="audio"></audio>

    <!-- Inclusão do script JavaScript -->
    <script src="./scripts/home.js"></script>
    <!-- Rodapé -->
    <footer>
    </footer>
</body>
</html>
